<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="David Orakpo — Senior Flutter & Cross-Platform Engineer Portfolio.">
  <meta name="theme-color" content="#120B0D">

  <!-- Preconnect to Google Fonts for faster font handshake -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- Preload Flutter bootstrap script -->
  <link rel="preload" href="flutter_bootstrap.js" as="script">

  <!-- iOS & PWA meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="David Orakpo">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>David Orakpo // Senior Flutter Engineer</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #120B0D;
      color: #FFF5F6;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      overflow: hidden;
    }

    #boot-loader {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 40%, rgba(255, 107, 129, 0.12), #120B0D 70%);
      z-index: 9999;
      transition: opacity 0.28s ease-out;
    }

    #boot-loader.loaded {
      opacity: 0;
      pointer-events: none;
    }

    .boot-badge {
      padding: 8px 14px;
      border: 1px solid rgba(255, 107, 129, 0.55);
      border-radius: 8px;
      background: rgba(255, 107, 129, 0.12);
      color: #FF6B81;
      font-weight: 800;
      font-size: 16px;
      letter-spacing: 1.5px;
      margin-bottom: 18px;
    }

    .boot-bar-track {
      width: 180px;
      height: 3px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 4px;
      overflow: hidden;
      margin-bottom: 12px;
    }

    .boot-bar-fill {
      width: 45%;
      height: 100%;
      background: linear-gradient(90deg, #FF6B81, #F43F5E);
      border-radius: 4px;
      animation: pulse-slide 1.1s infinite ease-in-out;
    }

    .boot-status {
      font-size: 11px;
      letter-spacing: 1.2px;
      color: #D1B3BA;
    }

    @keyframes pulse-slide {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(240%); }
    }
  </style>
</head>
<body>
  <div id="boot-loader">
    <div class="boot-badge">&lt;DO /&gt;</div>
    <div class="boot-bar-track">
      <div class="boot-bar-fill"></div>
    </div>
    <div class="boot-status">INITIALIZING PORTFOLIO ENGINE...</div>
  </div>

  <script>
    window.addEventListener('flutter-first-frame', function () {
      var loader = document.getElementById('boot-loader');
      if (loader) {
        loader.classList.add('loaded');
        setTimeout(function () {
          loader.remove();
        }, 300);
      }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
